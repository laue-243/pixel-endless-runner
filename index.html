<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel Bike Race — Improved</title>
<style>
body { background: #111; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; image-rendering: pixelated; }
canvas { border: 6px solid #333; image-rendering: pixelated; box-shadow: 0 0 40px #f004; }
</style>
</head>
<body>
<canvas id="game" width="400" height="600"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

let bikeX = 180, speed = 4, obstacles = [], score = 0;
let best = parseInt(localStorage.getItem('bikeBest')||'0');
let state = 'start', frame = 0, particles = [];

function spawn() {
  const lane = Math.floor(Math.random()*3);
  obstacles.push({x: lane*120+30, y:-80, w:50, h:70, color: ['#f44','#44f','#fa0'][Math.floor(Math.random()*3)]});
}

function addCrash(x,y) {
  for (let i=0; i<20; i++) {
    particles.push({x, y, vx:(Math.random()-0.5)*8, vy:(Math.random()-0.5)*8, life:30, color:'#f44'});
  }
}

function drawBike() {
  ctx.fillStyle = '#f00';
  ctx.fillRect(bikeX, 480, 40, 50);
  ctx.fillStyle = '#000';
  ctx.fillRect(bikeX+5, 490, 12, 12);
  ctx.fillRect(bikeX+23, 490, 12, 12);
  ctx.fillStyle = '#333';
  ctx.fillRect(bikeX+8, 500, 6, 6);
  ctx.fillRect(bikeX+26, 500, 6, 6);
  // Handlebars
  ctx.fillStyle = '#aaa';
  ctx.fillRect(bikeX-4, 470, 48, 4);
}

function draw() {
  ctx.fillStyle = '#222';
  ctx.fillRect(0,0,400,600);
  // Road markings
  ctx.fillStyle = '#fff';
  for (let i=0; i<3; i++) {
    for (let y=0; y<600; y+=50) {
      ctx.fillRect(i*130+115, (y + frame*speed)%600, 6, 25);
    }
  }
  // Side lines
  ctx.fillStyle = '#ff0';
  ctx.fillRect(5,0,8,600);
  ctx.fillRect(387,0,8,600);

  obstacles.forEach(o => {
    ctx.fillStyle = o.color;
    ctx.fillRect(o.x, o.y, o.w, o.h);
    ctx.fillStyle = '#000';
    ctx.fillRect(o.x+5, o.y+10, 15, 10);
    ctx.fillRect(o.x+30, o.y+10, 15, 10);
  });

  drawBike();

  particles.forEach((p,i) => {
    p.x += p.vx; p.y += p.vy; p.life--;
    ctx.globalAlpha = p.life/30;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 5, 5);
    if (p.life <= 0) particles.splice(i,1);
  });
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px monospace';
  ctx.fillText('Score: '+Math.floor(score), 10, 35);
  ctx.font = '16px monospace';
  ctx.fillText('Best: '+best, 10, 55);

  if (state === 'start') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0,0,400,600);
    ctx.fillStyle = '#f44';
    ctx.font = 'bold 36px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('BIKE RACE', 200, 220);
    ctx.font = '18px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('Arrow Left/Right to switch lanes', 200, 270);
    ctx.fillText('SPACE to start', 200, 320);
  }
  if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0,0,400,600);
    ctx.fillStyle = '#f44';
    ctx.font = 'bold 36px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('CRASH!', 200, 220);
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.fillText('Score: '+Math.floor(score), 200, 270);
    ctx.fillText('SPACE to retry', 200, 320);
  }
}

function update() {
  if (state !== 'play') return;
  frame++;
  score += 0.15;
  if (score > best) { best = Math.floor(score); localStorage.setItem('bikeBest', best); }
  speed = 4 + Math.floor(score / 100);

  if (frame % Math.max(40, 90 - Math.floor(score/50)) === 0) spawn();

  obstacles.forEach(o => {
    o.y += speed;
    if (o.y > 620) obstacles = obstacles.filter(ob => ob !== o);
    if (bikeX < o.x+o.w-5 && bikeX+40 > o.x+5 && 480 < o.y+o.h && 530 > o.y) {
      addCrash(bikeX+20, 500);
      state = 'over';
    }
  });
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

document.addEventListener('keydown', e => {
  if ((state === 'start' || state === 'over') && e.code === 'Space') {
    bikeX = 180; obstacles = []; score = 0; speed = 4; particles = [];
    state = 'play';
    return;
  }
  if (state !== 'play') return;
  if (e.key === 'ArrowLeft') bikeX = Math.max(20, bikeX - 130);
  if (e.key === 'ArrowRight') bikeX = Math.min(320, bikeX + 130);
});

loop();
</script>
</body>
</html>
